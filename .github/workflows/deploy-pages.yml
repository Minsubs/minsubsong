name: Deploy hanwha app to GitHub Pages

on:
  # 코드 push 가 올라오면 배포한다.
  push:
    branches: [main, master]
  # 데이터 자동 갱신 워크플로우가 끝나면 배포한다.
  # (기본 GITHUB_TOKEN 으로 만든 봇 push 는 push 트리거를 발화시키지 못하므로
  #  workflow_run 으로 명시적으로 이어붙인다.)
  workflow_run:
    workflows: ["Update KBO data (hanwha)"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포하고, 새 배포가 들어오면 진행 중인 배포는 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run 으로 트리거된 경우엔 데이터 갱신이 성공했을 때만 배포한다.
    # push / 수동 실행은 항상 배포한다.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 앱이라 빌드 없이 hanwha 디렉토리를 사이트 루트로 배포한다.
          path: ./hanwha

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
