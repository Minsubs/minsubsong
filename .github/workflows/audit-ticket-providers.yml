name: Audit ticket providers

on:
  workflow_dispatch:
  schedule:
    # 1/4/7/10월 1일 09:00 KST (00:00 UTC)
    - cron: "0 0 1 1,4,7,10 *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate official ticket rules and URLs
        working-directory: hanwha
        run: npm run audit:ticketing:network
